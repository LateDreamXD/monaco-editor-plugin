name: Deploy

on:
  push:
    branches: [ main ]
    paths: [ 'packages/docs/**' ]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup PNPM + Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          require-lockfile: true
          cache: true
      - name: Build Vitepress
        run: |
          pnpm run -C packages/core build
          pnpm run -C packages/docs build
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'packages/docs/.vitepress/dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v5
        id: deploy
